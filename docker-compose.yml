services:
  mock-k8s:
    build:
      context: .
      dockerfile: Dockerfile.mock
    environment:
      NAMESPACE: previews
      STATE_FILE: /data/mock-state.json
      # 演示“延迟删除”：feature-a 的对象 DELETE 后 15 秒才真正消失
      DELAY_FEATURE_A: "15"
      DEFAULT_DELETE_DELAY: "0"
    ports:
      - "18080:8080"
    volumes:
      - mock-data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      KUBE_API_BASE: http://mock-k8s:8080
      NAMESPACE: previews
      JOB_STORE: /data/jobs.json
      KUBE_TIMEOUT: "5"
    ports:
      - "8000:8000"
    depends_on:
      - mock-k8s
    volumes:
      - mock-data:/data

volumes:
  mock-data:
